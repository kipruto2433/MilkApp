<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B432E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MilkTrack" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/milktrack-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/milktrack-icon.svg" />
    <title>MilkTrack</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #E9F1EA; }
      @media (min-width: 768px) {
        body { padding: 16px; box-sizing: border-box; }
        #root { min-height: calc(100vh - 32px); }
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // Use a new worker URL so installations controlled by the original
          // cache-first worker can fetch this update instead of serving the
          // worker it cached for itself.
          navigator.serviceWorker.register('/sw-v2.js').catch(function (error) {
            console.warn('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </head>
  <body>
    <noscript>MilkTrack needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
  </body>
</html>
