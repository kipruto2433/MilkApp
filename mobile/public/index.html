<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B432E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MilkTrack" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/milktrack-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/milktrack-icon.svg" />
    <title>MilkTrack</title>
    <style>
      /* React Native Web's flex layouts need a definite root height. Using
         only min-height lets the navigator mount while its screens collapse
         to zero height, leaving a blank page. */
      html, body, #root, #root > div { width: 100%; height: 100%; min-height: 100%; margin: 0; }
      body { background: #E9F1EA; }
      @media (min-width: 768px) {
        body { padding: 16px; box-sizing: border-box; }
        #root { height: calc(100vh - 32px); min-height: calc(100vh - 32px); }
      }
    </style>
    <script>
      // Previous workers cached the startup bundle and caused blank launches.
      // Remove their registrations and caches so the application always loads
      // the current deployment. Offline collection data remains in local app
      // storage rather than in an HTML/JavaScript cache.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .catch(function () {});
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          return Promise.all(keys
            .filter(function (key) { return key.indexOf('milktrack-shell-') === 0; })
            .map(function (key) { return caches.delete(key); }));
        }).catch(function () {});
      }
    </script>
  </head>
  <body>
    <noscript>MilkTrack needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
  </body>
</html>
